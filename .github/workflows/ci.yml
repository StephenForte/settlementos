name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Compiles contracts, boots two Hardhat nodes, and runs unit + DB +
      # on-chain integration tests against an isolated fixture (tests/.tmp);
      # all env the suite needs is set by tests/setup-env.ts.
      - name: Test
        run: npm test
